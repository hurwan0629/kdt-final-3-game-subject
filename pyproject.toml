[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "space-z"
version = "0.1.0"
description = "Space Z: a Pygame space shooter and shared reinforcement-learning environment"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
rl = ["gymnasium>=0.29"]

[project.scripts]
space-z = "space_z.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
